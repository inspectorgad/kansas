name: Collect data

on:
  schedule:
    # Every 20 minutes. Prediction markets move continuously; everything else
    # changes far more slowly, but the collector is cheap and only writes when
    # content actually changed.
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated sources to collect (blank = all)"
        required: false
        default: ""

concurrency:
  # Never let two collector runs race to push the same data branch.
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out the data branch
        uses: actions/checkout@v4
        # The data branch does not exist on the first run; the next step creates
        # it. continue-on-error must sit at step level, not under `with`.
        continue-on-error: true
        with:
          ref: data
          path: published

      - name: Prepare the data branch
        run: |
          if [ ! -d published/.git ]; then
            echo "No data branch yet — creating an orphan branch."
            rm -rf published
            git clone --no-checkout . published
            cd published
            git checkout --orphan data
            git rm -rfq --cached . 2>/dev/null || true
            mkdir -p data
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Collect
        id: collect
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          set +e
          python collector/run.py \
            --data-dir published/data \
            ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }} \
            | tee collect.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish
        working-directory: published
        run: |
          git config user.name "ks-senate-collector"
          git config user.email "noreply@github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Nothing changed; not committing."
            exit 0
          fi
          git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4; do
            if git push origin data; then exit 0; fi
            echo "Push failed (attempt $attempt); retrying."
            sleep $((2 ** attempt))
            git fetch origin data && git rebase origin/data || true
          done
          echo "Push failed after 4 attempts." >&2
          exit 1

      - name: Report collector failures
        # Publishing whatever succeeded comes first; the job still fails so a
        # broken source is visible rather than quietly serving stale numbers.
        if: steps.collect.outputs.exit_code != '0'
        run: |
          echo "::error::One or more sources failed. See the log below."
          cat collect.log
          exit 1
