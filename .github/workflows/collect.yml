name: Collect data

on:
  schedule:
    # Every 20 minutes. Prediction markets move continuously; everything else
    # changes far more slowly, but the collector is cheap and only writes when
    # content actually changed.
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated sources to collect (blank = all)"
        required: false
        default: ""
      probe:
        description: "Probe instead of collecting. Space-separated: results ratings ads ground donors markets news"
        required: false
        default: ""

concurrency:
  # Never let two collector runs race to push the same data branch.
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # Full history, so the staleness guard below can ask git whether the
          # commit that last wrote the data branch is an ancestor of this one.
          fetch-depth: 0

      # The data branch is prepared by hand rather than with actions/checkout.
      #
      # The previous version checked it out with continue-on-error and then
      # created an orphan branch only `if [ ! -d published/.git ]`. But checkout
      # runs `git init` before it discovers the ref is missing, so on the very
      # first run that directory already existed: the guard skipped, no branch
      # named `data` was ever created, and the commit went nowhere. Every run
      # collected real data and then died on `src refspec data does not match
      # any`.
      #
      # `git init -b data` cannot fail that way — the branch exists before
      # anything else happens, whether or not the remote has one yet.
      - name: Prepare the data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf published
          mkdir -p published
          cd published
          git init -q -b data
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "ks-senate-collector"
          git config user.email "noreply@github.com"

          # Carry the existing branch forward when there is one. The history in
          # data/history/ is what the trend charts are built from, so starting
          # fresh each run would quietly flatten them.
          if git fetch --depth=1 origin data 2>/dev/null; then
            echo "Existing data branch fetched."
            git reset --hard FETCH_HEAD
          else
            echo "No data branch yet; starting one."
          fi
          mkdir -p data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Collect
        id: collect
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          # pipefail matters: without it `$?` reports tee's exit status, so a
          # failed collection looked like a successful one.
          set -o pipefail
          set +e
          # A probe run reports what an endpoint actually serves and writes
          # nothing, so publishing is skipped for it below.
          #
          # Several probes can be named at once, because each answers a separate
          # unknown and waiting a cron cycle between them wastes the afternoon.
          # They run in sequence in one job, each printing its own section.
          PROBES="${{ github.event.inputs.probe }}"
          if [ -n "$PROBES" ]; then
            status=0
            for probe in $PROBES; do
              echo "######## probe: $probe ########"
              python collector/run.py --data-dir published/data "--probe-$probe" || status=$?
            done | tee collect.log
            echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          else
            python collector/run.py \
              --data-dir published/data \
              ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }} \
              | tee collect.log
            echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        # A probe writes no data; publishing would commit nothing and the
        # staleness marker would be updated for a run that collected nothing.
        if: "!github.event.inputs.probe"
        working-directory: published
        env:
          OURS: ${{ github.sha }}
        run: |
          # Refuse to overwrite data written by newer code.
          #
          # This is not hypothetical. A workflow_dispatch run created at 15:30 on
          # f181451 finished at 16:20 — after two fixes had landed and after a
          # later scheduled run had published correct figures — and its old-code
          # output replaced them. Hamilton vanished from outside spending again,
          # the $214,014.88 double-count came back, and every committee was once
          # more labelled as both supporting and opposing the same candidate.
          #
          # Timestamps cannot catch this: the stale run generated its payload at
          # 16:20, genuinely later than the good one. What separates them is the
          # commit, so the commit is what gets compared. The concurrency group
          # serialises runs but says nothing about which code version they carry.
          PREVIOUS=""
          if [ -f collector-sha.txt ]; then
            PREVIOUS="$(tr -d '[:space:]' < collector-sha.txt)"
          fi
          if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "$OURS" ]; then
            # Ours is an ancestor of what is already published, so that came from
            # later code and this run is stale.
            if git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$OURS" "$PREVIOUS" 2>/dev/null; then
              echo "::warning::Skipping publish. This run is on $OURS; the data branch"
              echo "::warning::was written by $PREVIOUS, which is newer. Nothing overwritten."
              exit 0
            fi
          fi
          printf '%s\n' "$OURS" > collector-sha.txt

          git add -A data collector-sha.txt
          if git diff --cached --quiet; then
            echo "Nothing changed; not committing."
            exit 0
          fi
          git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          # HEAD:data is explicit: pushing the bare name `data` depends on a
          # local branch of that name resolving, which is what broke before.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:data; then exit 0; fi
            echo "Push failed (attempt $attempt); retrying."
            sleep $((2 ** attempt))
            git fetch --depth=1 origin data && git rebase FETCH_HEAD || true
          done
          echo "Push failed after 4 attempts." >&2
          exit 1

      - name: Report collector failures
        # Publishing whatever succeeded comes first; the job still fails so a
        # broken source is visible rather than quietly serving stale numbers.
        if: steps.collect.outputs.exit_code != '0'
        run: |
          echo "::error::One or more sources failed. See the log below."
          cat collect.log
          exit 1
