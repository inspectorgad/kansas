name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collector:
    name: Collector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r collector/requirements-dev.txt

      - name: Lint
        run: ruff check collector

      - name: Test
        working-directory: collector
        run: pytest

      - name: Election-night rehearsal
        # Runs the full results path against recorded pages. This is the one code
        # path that gets a single live outing, so it is exercised on every push.
        run: python collector/rehearse.py

  live-check:
    name: Live endpoint check
    runs-on: ubuntu-latest
    # The sandbox this collector was written in cannot reach any of the live
    # APIs, so this job is the only place the parsers meet real responses. It is
    # advisory on pull requests: an upstream outage should not block a merge,
    # but it must be visible.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Check live sources against the contract
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python collector/run.py --live-check

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug --no-daemon

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ks-senate-tracker-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/**
          if-no-files-found: ignore
